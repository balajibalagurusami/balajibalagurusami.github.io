name: Steel Quest Chapter 4 build
on:
  push:
    paths:
      - '.github/workflows/steelquest-ch4.yml'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Add Chapter 4 lessons and mark coverage
        shell: python
        run: |
          from pathlib import Path
          import json
          p=Path('steel-structures/textbook-data.js')
          text=p.read_text(encoding='utf-8')
          if "'4:Introduction'" not in text:
              entries=r"""
'4:Introduction':{e:'Chapter 4 explains why steel design cannot always be separated into a simple linear analysis followed by isolated member checks. For regular structures the traditional two-stage procedure may work, but system stability, member stability and connection behaviour interact. The chapter therefore introduces first- and second-order elastic analysis, buckling analysis, plastic analysis and advanced inelastic methods so the chosen model can better represent real frame behaviour.',q:'Why does the chapter move beyond a simple linear analysis followed by isolated member checks?',o:['Strength, stability and connection behaviour can interact at system level','Steel frames are always statically determinate','Member size never affects analysis','Connections have no influence on frame behaviour'],a:0},
'4:Methods of Analysis':{e:'The chapter uses load–displacement behaviour to organize analysis methods. It lists first-order elastic analysis, second-order elastic analysis including connection flexibility, linear and inelastic buckling analysis, first-order plastic analysis, and second-order inelastic or advanced analysis. Advanced methods include plastic-zone, elastic–plastic hinge, refined plastic hinge, notional-load plastic hinge and quasi-plastic hinge approaches.',q:'Which method explicitly combines second-order effects with inelastic material response?',o:['Second-order inelastic advanced analysis','First-order elastic analysis','Linear buckling analysis only','Dead-load calculation'],a:0},
'4:Elastic Analysis':{e:'Elastic analysis assumes linear-elastic material behaviour. First-order analysis enforces equilibrium on the undeformed geometry and ignores P–δ member and P–Δ frame second-order effects. Second-order elastic analysis instead enforces equilibrium on the deformed geometry, so axial load acting through member curvature or frame drift adds moments. The chapter discusses moment amplification, stability functions and geometric stiffness as practical ways to include these effects.',q:'What distinguishes second-order elastic analysis from first-order elastic analysis?',o:['Equilibrium is evaluated on the deformed geometry so P–δ and P–Δ effects can appear','The material must be perfectly plastic','All axial forces are ignored','Connections must be pinned'],a:0},
'4:Buckling (Critical Load) Analysis':{e:'Buckling analysis estimates the load at which an equilibrium configuration becomes unstable. Linear eigenvalue or bifurcation analysis uses elastic stiffness and geometric stiffness to obtain an elastic critical load and associated buckling mode; it does not by itself include yielding or residual-stress deterioration. Inelastic buckling analysis modifies stiffness, for example with a tangent modulus, to represent reduced stiffness as compression approaches yielding.',q:'What does a linear elastic buckling eigenvalue analysis primarily provide?',o:['An elastic critical load factor and buckling mode','A complete post-yield collapse history','A weld fatigue life','A concrete creep coefficient'],a:0},
'4:Sources of Non-linearity':{e:'The chapter groups important non-linear effects into material, geometric and combined/other sources. Material effects include gradual yielding, residual-stress-induced yielding, plastic frame deformation, yielding in connections or joint panels, fracture, strain hardening, cyclic plasticity and load-path effects. Geometric effects include initial imperfections, P–Δ and P–δ effects, eccentricities, local or cross-section distortion and finite-rotation effects. Connection deformation, panel zones, foundation flexibility, infill, secondary systems and out-of-plane bracing can also matter.',q:'Which is a geometric source of non-linearity identified in the chapter?',o:['P–Δ effect from axial load acting through frame drift','Steel chemical composition table','Unit weight of steel','Paint thickness'],a:0},
'4:Joint and Connection Effects':{e:'Real beam-column joints are neither dimensionless nor always perfectly rigid or pinned. The chapter considers finite joint size, panel-zone shear deformation and semi-rigid moment–rotation behaviour. Connection flexibility can redistribute beam and column moments and increase frame drift, which can in turn increase P–Δ effects. Semi-rigid frames are therefore analysed with connection moment–rotation relationships or rotational springs when these effects are significant.',q:'What can semi-rigid connection flexibility do to a frame?',o:['Redistribute moments and increase drift, affecting second-order response','Guarantee zero joint rotation','Remove all panel-zone shear','Make every frame non-sway'],a:0},
'4:First-Order Plastic Analysis':{e:'First-order plastic analysis ignores instability effects and determines collapse strength using a rigid-plastic idealization. Possible collapse mechanisms are examined to find the minimum collapse load, the plastic limit load. Loads are increased proportionately and the structure must possess enough ductility and plastic-hinge rotation capacity for a mechanism to form. The chapter notes restrictions against local buckling, lateral buckling and excessive axial-force effects so plastic moment capacity can be developed.',q:'What defines collapse in first-order rigid-plastic analysis?',o:['Enough plastic hinges form to create a mechanism at the plastic limit load','The first fibre anywhere reaches yield stress','The elastic deflection becomes zero','One bolt reaches slip load'],a:0},
'4:Second-Order Inelastic Analyses':{e:'Second-order inelastic or advanced analysis includes both material yielding and geometric second-order effects, allowing strength and stability to be assessed in a single system analysis. The chapter discusses plastic-zone, elastic–plastic hinge, refined plastic-hinge, notional-load plastic-hinge and quasi-plastic-hinge methods. Plastic-zone analysis models spread of yielding in detail; hinge methods concentrate plasticity and trade some detail for computational efficiency, with refined methods adding stiffness degradation, residual stresses and imperfections more realistically.',q:'What is the key objective of second-order inelastic advanced analysis?',o:['Assess strength and stability together while accounting for yielding and second-order effects','Use only undeformed geometry and elastic material','Ignore imperfections and residual stresses by definition','Replace structural analysis with member tables'],a:0},
'4:Practical Out-of-Plane Advanced Analysis':{e:'The advanced methods discussed earlier are mainly for two-dimensional frames under in-plane loading. The chapter warns that real frames can also fail out of plane through lateral bending, torsion and lateral or torsional buckling, especially when combined with axial force and in-plane bending. Practical three-dimensional advanced analysis therefore needs models that capture member and frame out-of-plane stiffness, imperfections, restraints and relevant code strength behaviour.',q:'Why is a purely in-plane advanced analysis not always sufficient for a steel frame?',o:['Members may also fail out of plane by lateral bending or torsional buckling','Steel has no out-of-plane stiffness','Gravity loads act only horizontally','Buckling is possible only in two dimensions'],a:0},
'4:Summary':{e:'The chapter summary contrasts conventional limit-states design based on first- or second-order elastic analysis plus separate member checks with advanced analysis that directly models system strength and stability. It reviews elastic, plastic, buckling and inelastic methods; joint and semi-rigid effects; and advanced-analysis refinements for residual stresses, geometric imperfections, second-order effects and connection response. It identifies refined plastic-hinge analysis as a particularly practical office method because it balances accuracy and computational efficiency.',q:'Which method does the chapter summary identify as especially practical for design-office advanced analysis?',o:['Refined plastic-hinge method','Pure first-order elastic analysis only','Hydrostatic load analysis','Working-stress design without stability checks'],a:0},
'4:Exercises':{e:'The exercise set asks the reader to compare linear-elastic and second-order elastic frame results, compute elastic and inelastic buckling loads, include semi-rigid connection flexibility, model foundation rotational stiffness, model infill action, calculate plastic collapse loads and compare advanced-analysis member forces with conventional linear-elastic analysis and code checks. The exercises are therefore a direct test of how modelling assumptions change structural response.',q:'Which comparison is explicitly required by the Chapter 4 exercises?',o:['First-order elastic results versus second-order or advanced-analysis results','Steel density versus concrete density only','Paint colour versus corrosion rate','Concrete cube strength versus slump'],a:0},
'4:Review Questions':{e:'The review questions ask when analysis and design become iterative, the limitations of the traditional two-stage design process, the advantage of inelastic analysis for direct design, the analysis methods available for two-dimensional steel frames, the assumptions of first-order elastic analysis, and why first-order results do not fully reflect true structural behaviour. Use this node as retrieval practice before checking the source.',q:'Which limitation of first-order elastic analysis is emphasized by the chapter review?',o:['It does not capture second-order and other non-linear behaviour of the real structure','It always predicts plastic collapse exactly','It automatically includes residual stresses','It can only analyse concrete structures'],a:0}
""".strip()
              if not text.rstrip().endswith('};'):
                  raise SystemExit('Unexpected textbook-data.js ending')
              text=text.rstrip()[:-2].rstrip()+',\n'+entries+'\n};\n'
              p.write_text(text,encoding='utf-8')
          cpath=Path('steel-structures/coverage.json')
          data=json.loads(cpath.read_text(encoding='utf-8'))
          ch=next(x for x in data['chapters'] if x['chapter']==4)
          ch.update(status='covered',covered_topics=12,total_topics=12)
          data['detailed_lessons']=68
          note='Chapter 4 is image-based. All 12 contents-list topics were verified against rendered textbook pages 267-321 before being marked covered. The lessons summarize the textbook analysis methods and are revision material, not a substitute for software-specific implementation guidance.'
          if note not in data.get('source_limitations',[]):
              data.setdefault('source_limitations',[]).append(note)
          data['updated']='2026-08-21'
          cpath.write_text(json.dumps(data,indent=2,ensure_ascii=False)+'\n',encoding='utf-8')
      - name: Commit generated Chapter 4 data
        run: |
          git config user.name "Steel Quest Builder"
          git config user.email "actions@users.noreply.github.com"
          git add steel-structures/textbook-data.js steel-structures/coverage.json
          git diff --cached --quiet && exit 0
          git commit -m "Cover Steel Quest Chapter 4"
          git push origin main
