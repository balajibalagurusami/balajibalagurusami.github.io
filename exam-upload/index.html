<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#000000" />
  <title>BITS WILP Exam Upload Links</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: #000;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    main {
      width: 100%;
      max-width: 560px;
    }
    h1 {
      font-size: clamp(28px, 7vw, 42px);
      line-height: 1.05;
      margin: 0 0 10px;
    }
    .sub {
      color: #b8b8b8;
      margin: 0 0 28px;
      line-height: 1.5;
    }
    section {
      border: 1px solid #2b2b2b;
      border-radius: 18px;
      padding: 18px;
      margin: 14px 0;
      background: #0c0c0c;
    }
    h2 {
      font-size: 18px;
      margin: 0 0 12px;
    }
    .links {
      display: grid;
      gap: 10px;
    }
    a {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      width: 100%;
      min-height: 58px;
      padding: 16px 18px;
      border-radius: 14px;
      background: #fff;
      color: #000;
      text-decoration: none;
      font-weight: 700;
      font-size: 16px;
    }
    a span:last-child {
      font-size: 20px;
      line-height: 1;
    }
    a:active { transform: scale(.99); }
    .note {
      margin: 22px 4px 0;
      color: #8e8e8e;
      font-size: 13px;
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <main>
    <h1>BITS WILP Exam</h1>
    <p class="sub">Answer sheet upload — app and web access links.</p>

    <section>
      <h2>Android</h2>
      <div class="links">
        <a href="https://play.google.com/store/search?q=BITS%20WILP&c=apps" target="_blank" rel="noopener">
          <span>BITS App</span><span>↗</span>
        </a>
        <a href="https://play.google.com/store/search?q=Mercer%20Mettl&c=apps" target="_blank" rel="noopener">
          <span>Mercer Mettl</span><span>↗</span>
        </a>
      </div>
    </section>

    <section>
      <h2>iOS</h2>
      <div class="links">
        <a href="https://apps.apple.com/in/search?term=BITS%20WILP" target="_blank" rel="noopener">
          <span>BITS App</span><span>↗</span>
        </a>
        <a href="https://apps.apple.com/in/search?term=Mercer%20Mettl" target="_blank" rel="noopener">
          <span>Mercer Mettl</span><span>↗</span>
        </a>
      </div>
    </section>

    <section>
      <h2>Web</h2>
      <div class="links">
        <a href="https://tests.mettl.com/" target="_blank" rel="noopener">
          <span>Mercer Mettl</span><span>↗</span>
        </a>
      </div>
    </section>

    <p class="note">Use the exam instructions issued by BITS WILP for the required upload method.</p>
  </main>
</body>
</html>
